<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Shield Shape -->
  <g filter="url(#shadow)">
    <path d="M 256 90 L 390 140 C 390 280 256 390 256 420 C 256 390 122 280 122 140 Z" fill="url(#shieldGrad)" />
  </g>

  <!-- Inner Shield Glow/Accent -->
  <path d="M 256 115 L 365 156 C 365 270 256 362 256 388 C 256 362 147 270 147 156 Z" fill="#090d16" />

  <!-- Stylized Cyber 'P' and Radar Pulse -->
  <path d="M 220 180 L 275 180 C 305 180 325 195 325 225 C 325 255 305 270 275 270 L 248 270 L 248 330 L 220 330 Z" fill="#38bdf8" />
  <path d="M 248 206 L 270 206 C 285 206 295 214 295 225 C 295 236 285 244 270 244 L 248 244 Z" fill="#090d16" />

  <!-- Lock/Keyhole Accent -->
  <circle cx="256" cy="335" r="8" fill="#38bdf8" />
</svg>
